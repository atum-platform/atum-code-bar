name: Fork app build

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: fork-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-test-and-package:
    runs-on: [self-hosted, macOS, ARM64, macbook, local-ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          clean: false

      - name: Select Xcode 26.3 or 26.2
        shell: bash
        run: |
          set -euo pipefail
          selected_developer_dir=""
          for candidate in /Applications/Xcode_26.3.app /Applications/Xcode_26.2.app /Applications/Xcode.app; do
            developer_dir="${candidate}/Contents/Developer"
            if [[ -d "$developer_dir" ]] \
              && [[ "$(DEVELOPER_DIR="$developer_dir" /usr/bin/xcodebuild -version)" == Xcode\ 26.* ]]; then
              selected_developer_dir="$developer_dir"
              break
            fi
          done
          [[ -n "$selected_developer_dir" ]]
          echo "DEVELOPER_DIR=$selected_developer_dir" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$selected_developer_dir" /usr/bin/xcodebuild -version
          DEVELOPER_DIR="$selected_developer_dir" /usr/bin/swift --version

      - name: Test first-launch usage tracking
        run: swift test --filter 'ProviderDetectionPolicyTests|SettingsStoreRefreshDefaultTests|KimiSettingsReaderTests'

      - name: Test refresh request context
        run: swift test --filter ProviderRefreshRequestContextTests

      - name: Test Claude delegated refresh epoch
        run: swift test --filter ClaudeOAuthDelegatedRefreshEpochTests

      - name: Test Claude background Auto durability
        run: swift test --filter ClaudeCLIBackgroundAvailabilityTests

      - name: Test Claude prompt coalescing
        run: swift test --filter ClaudeOAuthPromptCoalescingTests

      - name: Test compact Overview rows
        run: |
          swift test --filter OverviewMenuCardRowViewTests
          swift test --filter "compact overview omits"

      - name: Test single-instance launch guard
        run: swift test --filter CodexBarLaunchModeTests

      - name: Test Tahoe menu-bar visibility recovery
        run: swift test --filter MenuBarVisibilityWatcherTests

      - name: Package ad-hoc app
        env:
          CODEXBAR_SIGNING: adhoc
        run: ./Scripts/package_app.sh release

      - name: Archive app
        run: ditto -c -k --keepParent CodexBar.app CodexBar-fork.zip

      - name: Upload app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CodexBar-fork-macos
          path: CodexBar-fork.zip
          if-no-files-found: error
          retention-days: 7
